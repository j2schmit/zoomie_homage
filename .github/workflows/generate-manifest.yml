name: Generate photo manifest

on:
  push:
    branches: [main]
    paths:
      - "images/**"
      - "scripts/generate-manifest.js"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate images/manifest.json
        run: node scripts/generate-manifest.js

      - name: Commit manifest if changed
        run: |
          if ! git diff --quiet -- images/manifest.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add images/manifest.json
            git commit -m "chore: regenerate photo manifest"
            git push
          else
            echo "Manifest already up to date."
          fi
