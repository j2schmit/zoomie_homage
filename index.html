<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Zoomie</title>

<!-- ============================================================
     HOW TO USE THIS FILE
     1. Edit the DETAILS in the header (name, dates) and the tribute.
     2. Drop your photos into the /images folder. The photo list is read
        automatically from images/manifest.json at load time — run
        `node scripts/generate-manifest.js` after adding/removing photos
        (or let .github/workflows/generate-manifest.yml do it on push).
     3. Put your Vimeo video ID where it says VIDEO_ID.
     4. Put your MP3 at music/zoomie.mp3 (or edit the <audio> src).
     No build step to view it. Just open the file or push it live.
     ============================================================ -->

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet" />

<style>
  :root {
    --bg:    #FBFAF3;  /* warm sunlit paper */
    --ink:   #2C382B;  /* deep meadow green-black */
    --soft:  #6A7A63;  /* muted sage for secondary text */
    --moss:  #5E8250;  /* grass green */
    --amber: #E39A34;  /* golden-hour accent */
    --sky:   #B7D0DC;  /* soft sky, used sparingly */
    --line:  #E6E2D4;  /* hairline */
    --shadow: 0 12px 30px rgba(44,56,43,0.12);
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Nunito Sans", system-ui, sans-serif;
    font-size: 18px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 940px; margin: 0 auto; padding: 0 24px; }

  /* ---------- Hero ---------- */
  header {
    text-align: center;
    padding: 88px 24px 56px;
    position: relative;
    overflow: hidden;
  }
  .path {
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 620px; max-width: 120%;
    height: 100%;
    pointer-events: none;
    opacity: 0.5;
  }
  .path path {
    fill: none;
    stroke: var(--sky);
    stroke-width: 2.5;
    stroke-dasharray: 3 12;
    stroke-linecap: round;
  }
  .eyebrow {
    font-size: 0.82rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--moss);
    font-weight: 700;
    margin: 0 0 18px;
  }
  h1 {
    font-family: "Fraunces", serif;
    font-optical-sizing: auto;
    font-weight: 500;
    font-size: clamp(4rem, 16vw, 8.5rem);
    line-height: 0.92;
    margin: 0;
    letter-spacing: -0.01em;
  }
  h1 .dash {
    display: block;
    width: 92px; height: 6px;
    margin: 22px auto 0;
    border-radius: 6px;
    background: linear-gradient(90deg, var(--amber), var(--moss));
  }
  .dates {
    margin: 26px 0 0;
    font-family: "Fraunces", serif;
    font-style: italic;
    font-size: 1.35rem;
    color: var(--soft);
  }

  /* ---------- Tribute ---------- */
  .tribute {
    max-width: 620px;
    margin: 8px auto 0;
    padding: 40px 24px 8px;
    text-align: center;
  }
  .tribute p { margin: 0 0 1.1em; }
  .tribute p:first-child::first-letter {
    font-family: "Fraunces", serif;
    font-size: 3.2rem;
    line-height: 0.8;
    float: left;
    padding: 8px 12px 0 0;
    color: var(--amber);
  }

  /* ---------- Section heading ---------- */
  .section-head {
    text-align: center;
    margin: 56px 0 26px;
  }
  .section-head span {
    font-family: "Fraunces", serif;
    font-size: 1.6rem;
    color: var(--ink);
    position: relative;
  }
  .section-head span::before,
  .section-head span::after {
    content: "";
    position: absolute;
    top: 50%;
    width: 46px; height: 1px;
    background: var(--line);
  }
  .section-head span::before { right: 100%; margin-right: 18px; }
  .section-head span::after  { left: 100%;  margin-left: 18px; }

  /* ---------- Slideshow ---------- */
  .slideshow {
    max-width: 720px;
    margin: 0 auto;
    position: relative;
  }
  .slides {
    aspect-ratio: 4 / 3;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: var(--shadow);
    background: var(--bg);        /* warm bars behind letterboxed photos */
    position: relative;
  }
  .slides img {
    width: 100%; height: 100%;
    object-fit: contain;          /* show the whole photo, never crop */
    display: block;
    position: absolute; inset: 0;
    opacity: 0;
    transition: opacity 0.8s ease;
    cursor: zoom-in;
  }
  .slides img.active { opacity: 1; }

  .slideshow .arrow {
    position: absolute; top: 50%;
    transform: translateY(-50%);
    background: rgba(251,250,243,0.85);
    border: none; border-radius: 50%;
    width: 44px; height: 44px;
    font-size: 1.4rem; color: var(--ink);
    cursor: pointer; line-height: 1;
    box-shadow: 0 4px 12px rgba(44,56,43,0.18);
    transition: background 0.2s;
    z-index: 2;
  }
  .slideshow .arrow:hover { background: #fff; }
  .slideshow .arrow:focus-visible { outline: 3px solid var(--amber); }
  .slideshow .prev { left: 12px; }
  .slideshow .next { right: 12px; }

  .dots { display: flex; justify-content: center; gap: 9px; margin-top: 16px; }
  .dots button {
    width: 9px; height: 9px; padding: 0;
    border: none; border-radius: 50%;
    background: var(--line); cursor: pointer;
    transition: background 0.2s, transform 0.2s;
  }
  .dots button.active { background: var(--amber); transform: scale(1.25); }

  /* ---------- Video ---------- */
  .video {
    max-width: 720px;
    margin: 0 auto;
    aspect-ratio: 16 / 9;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  .video iframe { width: 100%; height: 100%; border: 0; display: block; }

  /* ---------- Footer ---------- */
  footer {
    text-align: center;
    padding: 40px 24px 96px;
    color: var(--soft);
    font-size: 0.95rem;
  }
  footer .paw { color: var(--amber); font-size: 1.1rem; }

  /* ---------- Lightbox ---------- */
  .lightbox {
    position: fixed; inset: 0;
    background: rgba(28,36,27,0.92);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 50;
  }
  .lightbox.open { display: flex; }
  .lightbox img {
    max-width: 92vw; max-height: 88vh;
    border-radius: 10px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .lightbox button {
    position: absolute; top: 20px; right: 24px;
    background: none; border: none;
    color: #fff; font-size: 2.4rem;
    cursor: pointer; line-height: 1;
    opacity: 0.8;
  }
  .lightbox button:hover { opacity: 1; }

  /* ---------- Music pill ---------- */
  .music {
    position: fixed;
    bottom: 20px; right: 20px;
    z-index: 40;
    display: flex; align-items: center; gap: 10px;
    background: rgba(251,250,243,0.9);
    backdrop-filter: blur(6px);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 9px 16px 9px 12px;
    box-shadow: var(--shadow);
    font-family: "Nunito Sans", sans-serif;
    font-size: 0.9rem; color: var(--soft);
    cursor: pointer;
    transition: transform 0.2s;
  }
  .music:hover { transform: translateY(-2px); }
  .music:focus-visible { outline: 3px solid var(--amber); }
  .music .icon { font-size: 1.1rem; color: var(--moss); line-height: 1; }

  /* ---------- Intro / click-to-enter screen ---------- */
  .intro {
    position: fixed; inset: 0;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    width: 100%;
    background: var(--bg);
    border: none;
    margin: 0;
    padding: 24px;
    font-family: "Nunito Sans", sans-serif;
    cursor: pointer;
    transition: opacity 0.9s ease, visibility 0.9s ease;
  }
  .intro.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  .intro-eyebrow {
    font-size: 0.82rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--moss);
    font-weight: 700;
  }
  .intro-name {
    font-family: "Fraunces", serif;
    font-optical-sizing: auto;
    font-weight: 500;
    font-size: clamp(3rem, 14vw, 6rem);
    line-height: 1;
    color: var(--ink);
  }
  .intro-cta {
    margin-top: 10px;
    font-family: "Fraunces", serif;
    font-style: italic;
    font-size: 1.1rem;
    color: var(--soft);
    animation: pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }

  body.intro-active { overflow: hidden; }

  /* ---------- Entrance animation ---------- */
  .reveal { opacity: 0; transform: translateY(14px); animation: rise 0.9s ease forwards; }
  .reveal.d1 { animation-delay: 0.15s; }
  .reveal.d2 { animation-delay: 0.30s; }
  .reveal.d3 { animation-delay: 0.45s; }
  @keyframes rise { to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; scroll-behavior: auto; }
    .reveal { opacity: 1; transform: none; }
    .slides img { transition: none; }
    .intro-cta { animation: none; }
  }
</style>
</head>
<body class="intro-active">

  <!-- ---------- Click-to-enter intro ---------- -->
  <button class="intro" id="intro" aria-label="Click to Continue">
    <span class="intro-eyebrow">An homage to the legend</span>
    <span class="intro-name">Zoomie</span>
    <span class="intro-cta">Click to enter</span>
  </button>

  <section class="tribute reveal d3">
    <p>An homage to the legend. A fiercely loyal companion, relentless barn dog, and dog of the world. He played hard, worked hard, and loved hard.</p>
  </section>

  <!-- ---------- Slideshow ---------- -->
  <div class="wrap">
    <div class="section-head"><span>The legend in photos</span></div>
    <div class="slideshow" id="slideshow" aria-roledescription="carousel" aria-label="Photos of Zoomie">
      <div class="slides" id="slides"></div>
      <button class="arrow prev" aria-label="Previous photo">&#8249;</button>
      <button class="arrow next" aria-label="Next photo">&#8250;</button>
      <div class="dots" id="dots"></div>
    </div>
  </div>

  <!-- ---------- Video (replace VIDEO_ID with your Vimeo number) ---------- -->
  <div class="wrap">
    <div class="section-head"><span>In motion</span></div>
    <div class="video">
      <iframe
        src="https://player.vimeo.com/video/534718419"
        allow="autoplay; fullscreen; picture-in-picture"
        allowfullscreen
        title="Zoomie">
      </iframe>
    </div>
  </div>

  <!-- ============ EDIT YOUR DETAILS HERE ============ -->
  <header>
    <svg class="path" viewBox="0 0 620 620" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
      <path d="M120,300 C120,160 260,120 340,200 C430,290 300,400 200,360 C120,330 140,470 300,500 C460,530 520,380 480,260" />
    </svg>
    <p class="eyebrow reveal">In loving memory</p>
    <h1 class="reveal d1">Zoomie<span class="dash"></span></h1>
    <p class="dates reveal d2">2011 &nbsp;&mdash;&nbsp; 2026</p>
  </header>

  <footer>
    <p><span class="paw">&#10084;</span><br />
    Zoomie &middot; the legend lives on</p>
  </footer>

  <!-- ---------- Music (put your file at music/zoomie.mp3) ---------- -->
  <button class="music" id="music" aria-label="Play music">
    <span class="icon" id="musicIcon">&#9654;</span>
    <span id="musicLabel">Zoomie Radio</span>
  </button>
  <audio id="audio" loop src="music/police_pon_my_back.mp3" preload="none"></audio>

  <!-- ============ PHOTOS (auto-loaded from images/manifest.json) ============ -->
  <script>
    // The photo list isn't hand-maintained here — scripts/generate-manifest.js
    // scans the /images folder and writes /images/manifest.json, which we
    // fetch below. Drop photos into /images, regenerate the manifest (or let
    // .github/workflows/generate-manifest.yml do it on push), done.
    function altFromFilename(filename) {
      return filename
        .replace(/\.[^.]+$/, "")             // drop extension
        .replace(/(\D)(\d+)$/, "$1 $2")      // "arena2" -> "arena 2"
        .replace(/[_-]+/g, " ")              // underscores/hyphens -> spaces
        .trim()
        .replace(/^./, c => c.toUpperCase()); // sentence case
    }

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    /* ---- Lightbox (shared) ---- */
    const lb = document.createElement("div");
    lb.className = "lightbox";
    lb.innerHTML = `<button aria-label="Close">&times;</button><img alt="" />`;
    document.body.appendChild(lb);
    const lbImg = lb.querySelector("img");
    function openLightbox(src, alt) { lbImg.src = src; lbImg.alt = alt; lb.classList.add("open"); }
    function closeLightbox() { lb.classList.remove("open"); }
    lb.addEventListener("click", e => { if (e.target !== lbImg) closeLightbox(); });
    document.addEventListener("keydown", e => { if (e.key === "Escape") closeLightbox(); });

    /* ---- Slideshow ---- */
    function initSlideshow(PHOTOS) {
      if (!PHOTOS.length) return; // no manifest / no photos — nothing to show

      const slides = document.getElementById("slides");
      const dots = document.getElementById("dots");
      let i = 0, timer;

      PHOTOS.forEach((p, idx) => {
        const img = document.createElement("img");
        img.src = p.src; img.alt = p.alt; img.loading = "lazy";
        if (idx === 0) img.classList.add("active");
        img.addEventListener("click", () => openLightbox(p.src, p.alt)); // click to enlarge
        slides.appendChild(img);

        const dot = document.createElement("button");
        dot.setAttribute("aria-label", `Go to photo ${idx + 1}`);
        if (idx === 0) dot.classList.add("active");
        dot.addEventListener("click", () => { go(idx); restart(); });
        dots.appendChild(dot);
      });

      const imgs = slides.querySelectorAll("img");
      const dotEls = dots.querySelectorAll("button");

      function go(n) {
        imgs[i].classList.remove("active");
        dotEls[i].classList.remove("active");
        i = (n + PHOTOS.length) % PHOTOS.length;
        imgs[i].classList.add("active");
        dotEls[i].classList.add("active");
      }
      const next = () => go(i + 1);
      const prev = () => go(i - 1);

      document.querySelector(".next").addEventListener("click", () => { next(); restart(); });
      document.querySelector(".prev").addEventListener("click", () => { prev(); restart(); });
      document.addEventListener("keydown", e => {
        if (e.key === "ArrowRight") { next(); restart(); }
        if (e.key === "ArrowLeft")  { prev(); restart(); }
      });

      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      function start() { if (!reduce) timer = setInterval(next, 4000); }
      function stop()  { clearInterval(timer); }
      function restart() { stop(); start(); }

      start();
    }

    fetch("images/manifest.json")
      .then(r => r.json())
      .then(files => shuffle(files.map(name => ({ src: `images/${name}`, alt: altFromFilename(name) }))))
      .catch(err => {
        console.error("Could not load images/manifest.json — run scripts/generate-manifest.js", err);
        return [];
      })
      .then(initSlideshow);

    /* ---- Music: manual toggle + auto-start via intro screen ---- */
    (function () {
      const audio = document.getElementById("audio");
      const btn = document.getElementById("music");
      const icon = document.getElementById("musicIcon");
      const label = document.getElementById("musicLabel");
      const intro = document.getElementById("intro");

      function showPlaying() {
        icon.innerHTML = "&#10074;&#10074;";
        label.textContent = "Pause";
        btn.setAttribute("aria-label", "Pause music");
      }
      function showPaused() {
        icon.innerHTML = "&#9654;";
        label.textContent = "Play his song";
        btn.setAttribute("aria-label", "Play music");
      }

      btn.addEventListener("click", () => {
        if (audio.paused) { audio.play().then(showPlaying).catch(() => {}); }
        else { audio.pause(); showPaused(); }
      });

      intro.addEventListener("click", () => {
        audio.play().then(showPlaying).catch(() => {});
        intro.classList.add("hide");
        document.body.classList.remove("intro-active");
        intro.addEventListener("transitionend", () => intro.remove(), { once: true });
      });

      intro.focus();
    })();
  </script>

</body>
</html>
